<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>小念的创作笔记</title>
  <link rel="icon" href="/app.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/voice-studio.css">
  <link rel="stylesheet" href="/drawing.css">
  <link rel="stylesheet" href="/companion.css">
  <link rel="stylesheet" href="/immersion.css">
  <link rel="stylesheet" href="/module-help.css">
  <link rel="stylesheet" href="/character-life.css">
  <link rel="stylesheet" href="/character-packages.css">
  <link rel="stylesheet" href="/character-resources.css">
  <link rel="stylesheet" href="/instances.css">
  <link rel="stylesheet" href="/user-settings.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">跳到工作区</a>
  <div class="ambient" aria-hidden="true"></div>
  <div id="app-shell" class="workbench" aria-busy="true">
    <aside class="sidebar glass">
      <a class="brand" href="#/settings" aria-label="打开用户设置"><span id="sidebar-user-avatar" class="brand-mark is-empty" aria-hidden="true"></span><span class="brand-identity"><strong id="sidebar-user-name">请输入用户名</strong></span></a>
      <nav class="primary-nav" aria-label="工作台导航">
        <a href="#/home" data-nav="home"><span data-icon="home"></span><span>我的工作台</span></a>
        <a href="#/catalog" data-nav="catalog"><span data-icon="grid"></span><span>添加模块</span><span class="nav-arrow" data-icon="plus"></span></a>
        <a href="#/characters" data-nav="characters"><span data-icon="person"></span><span>角色资料</span></a>
      </nav>
      <div class="sidebar-section"><span>我的模块</span><span id="installed-count" class="small-count">0</span></div>
      <nav id="module-nav" class="module-nav" aria-label="已添加模块"></nav>
      <div class="sidebar-bottom">
        <nav class="primary-nav" aria-label="管理"><a href="#/events" data-nav="events"><span data-icon="activity"></span><span>运行记录</span></a><a href="#/settings" data-nav="settings"><span data-icon="settings"></span><span>工作台设置</span></a></nav>
        <div class="local-status"><span id="connection-dot" class="dot"></span><span id="connection-label">连接中</span><span class="version">v1.0</span></div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb"><span>工作台</span><span class="divider">/</span><strong id="route-title">我的工作台</strong></div>
        <div class="topbar-actions">
          <label class="character-switch glass" for="character-select"><span data-icon="person"></span><span class="sr-only">当前角色</span><select id="character-select" aria-label="当前角色"><option value="">暂不选择角色</option></select><span data-icon="chevron"></span></label>
          <button id="theme-toggle" class="icon-button glass" type="button" title="切换深色主题" aria-label="切换深色主题"><span data-icon="moon"></span></button>
          <button id="activity-toggle" class="icon-button glass" type="button" title="查看运行信息" aria-label="查看运行信息" aria-expanded="false" aria-controls="activity-drawer"><span data-icon="activity"></span></button>
        </div>
      </header>
      <div id="service-error" class="service-error" role="alert" hidden><span id="service-error-text"></span><button id="retry-service" class="button small" type="button">重新连接</button></div>
      <main id="main-content" tabindex="-1"><div id="page-content"><div class="initial-loading"><span class="loading-orbit" aria-hidden="true"></span><h1>正在打开工作台</h1><p>读取模块和角色资料…</p></div></div><div id="cards-content" hidden></div></main>
    </div>
  </div>
  <aside id="activity-drawer" class="activity-drawer glass" aria-labelledby="activity-title" hidden><div class="drawer-heading"><h2 id="activity-title">运行信息</h2><button id="close-activity" class="icon-button" type="button" aria-label="关闭运行信息"><span data-icon="close"></span></button></div><div id="drawer-content"></div><a class="text-link" href="#/events">查看全部记录 <span data-icon="arrow"></span></a></aside>
  <div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="close-toast" class="icon-button" type="button" aria-label="关闭提示"><span data-icon="close"></span></button></div>
  <div id="help-tooltip" class="help-tooltip" role="tooltip" hidden></div>
</body>
</html>
